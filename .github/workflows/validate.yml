name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint and render
        run: |
          helm lint charts/sample-app
          helm template sample-app charts/sample-app > /dev/null
      - name: Kustomize build
        run: |
          kubectl kustomize logging/fluent-bit/overlays/local > /dev/null
          kubectl kustomize logging/fluent-bit/overlays/aws > /dev/null

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error, Warning
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -eq 'Error') { exit 1 }
