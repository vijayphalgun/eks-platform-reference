# For EKS: ship compressed logs to S3. ${LOGS_BUCKET} and ${AWS_REGION}
# are substituted by scripts/Deploy.ps1 from Terraform outputs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: fluent-bit-config
    behavior: merge
    files:
      - output.conf
