[OUTPUT]
    Name              s3
    Match             kube.*
    bucket            ${LOGS_BUCKET}
    region            ${AWS_REGION}
    compression       gzip
    total_file_size   50M
    upload_timeout    5m
    store_dir         /var/fluent-bit/state/s3
    s3_key_format     /containers/%Y/%m/%d/%H/$TAG[4]-%M%S-$UUID.gz
