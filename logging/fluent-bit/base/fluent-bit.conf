[SERVICE]
    Flush             5
    Log_Level         info
    Parsers_File      parsers.conf
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    Health_Check      On

# Tail container logs written by containerd (CRI format).
[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/*.log
    Exclude_Path      /var/log/containers/fluent-bit*.log
    multiline.parser  cri
    DB                /var/fluent-bit/state/flb_kube.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# Re-join stack traces and wrapped lines into a single record:
# built-in parsers for Java, Python and Go, plus a timestamp-anchored
# parser for .NET and Node services that log one entry per timestamp.
[FILTER]
    Name                  multiline
    Match                 kube.*
    multiline.key_content log
    multiline.parser      java,python,go,multiline-timestamp

# Enrich every record with pod, namespace, labels and container metadata.
[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Keep_Log            Off
    K8S-Logging.Parser  On
    K8S-Logging.Exclude On
    Annotations         Off

@INCLUDE output.conf
