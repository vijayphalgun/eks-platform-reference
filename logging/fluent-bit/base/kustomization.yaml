apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logging

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - daemonset.yaml

configMapGenerator:
  - name: fluent-bit-config
    files:
      - fluent-bit.conf
      - parsers.conf
      - output.conf

labels:
  - pairs:
      app.kubernetes.io/name: fluent-bit
    includeSelectors: true
